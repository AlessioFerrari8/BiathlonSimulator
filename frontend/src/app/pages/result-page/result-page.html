@if (race(); as race) {
  <section class="flex flex-1 flex-col justify-center gap-6 py-8">
    <div>
      <p class="label text-amber">{{ race.rank === 1 ? 'New personal best' : 'Finish' }}</p>
      <h1 class="mt-2 text-6xl font-extrabold tabular-nums sm:text-8xl">{{ formatTime(race.result.totalMs) }}</h1>
      <p class="mt-2 text-lg text-mist">{{ medal() }} · {{ race.result.misses }} missed</p>
    </div>

    <div class="flex flex-wrap gap-3">
      <a routerLink="/race" class="btn btn-primary">Race again</a>
      <a routerLink="/" class="btn">Home</a>
    </div>
  </section>
}
